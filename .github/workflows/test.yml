name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: countersign_test
          POSTGRES_PASSWORD: countersign_test
          POSTGRES_DB: countersign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U countersign_test -d countersign_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUN_DB_SPIKE: "0"
      RUN_DECISION_DB_TESTS: "1"
      DATABASE_URL_TEST: "postgresql://countersign_test:countersign_test@127.0.0.1:5432/countersign_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config tests/db/prisma.config.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
